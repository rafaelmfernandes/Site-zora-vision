  <header class="header">

```
<a

  class="btn-voltar"

>
  &#8592;
</a>

<h1 class="header-titulo">
  Acessar Conta
</h1>

<div class="header-espaco"></div>
```

  </header>

  <!-- ============================================================
       CONTEÚDO PRINCIPAL
       ============================================================ -->

  <main class="login-container">

```
<div class="boas-vindas">

  <h2>
    Bem-vindo de volta! 👋
  </h2>

  <p>
    Acesse sua conta para continuar suas compras e acompanhar pedidos.
  </p>

</div>


<!-- ============================================================
     LOGIN SOCIAL
     ============================================================ -->

<div class="social-box">

  <!-- ==========================================================
       GOOGLE
       ========================================================== -->

  <button
    type="button"
    id="btn-login-google"
    class="btn-social google"
  >

    <span class="social-icon">
      🌐
    </span>

    <span>
      Entrar com o Google
    </span>

  </button>


  <!-- ==========================================================
       APPLE
       ========================================================== -->

  <button
    type="button"
    class="btn-social apple"
    id="btn-login-apple"
  >

    <span class="social-icon">
      🍎
    </span>

    <span>
      Entrar com a Apple
    </span>

  </button>

</div>


<!-- ============================================================
     DIVISOR
     ============================================================ -->

<div class="divisor">

  <span class="linha"></span>

  <span class="divisor-texto">
    OU
  </span>

  <span class="linha"></span>

</div>


<!-- ============================================================
     FORMULÁRIO DE LOGIN
     ============================================================ -->

<form id="form-login">

  <div class="campo">

    <label for="email">
      E-mail
    </label>

    <input
      type="email"
      id="email"
      placeholder="seuemail@exemplo.com"
      autocomplete="email"
      required
    >

  </div>


  <div class="campo">

    <label for="senha">
      Senha
    </label>

    <input
      type="password"
      id="senha"
      placeholder="Digite sua senha"
      autocomplete="current-password"
      required
    >

  </div>


  <div class="esqueceu-senha">

    <a href="02-Recuperar-senha.html">
      Esqueceu a senha?
    </a>

  </div>


  <button
    type="submit"
    class="btn-entrar"
  >
    Entrar na minha conta
  </button>

</form>


<!-- ============================================================
     CADASTRO
     ============================================================ -->

<div class="link-cadastro-box">

  Ainda não tem conta?

  <a href="02-cadastro.html">
    Cadastrar-se
  </a>

</div>
```
