<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento PIX - Zora Vision</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        .pagina {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .descricao {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .status {
            padding: 14px;
            border-radius: 10px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .qr-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .qr-container img {
            width: 260px;
            height: 260px;
            object-fit: contain;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            background: #ffffff;
        }

        .valor {
            font-size: 25px;
            font-weight: 800;
            color: #16a34a;
            margin: 20px 0;
        }

        .pedido {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .pix-label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .pix-codigo {
            width: 100%;
            min-height: 100px;
            resize: none;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px;
            font-size: 12px;
            color: #334155;
            background: #f8fafc;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-copiar {
            background: #2563eb;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .btn-copiar:hover {
            background: #1d4ed8;
        }

        .btn-voltar {
            background: #f1f5f9;
            color: #334155;
        }

        .erro {
            display: none;
            padding: 14px;
            border-radius: 10px;
            background: #fef2f2;
            color: #dc2626;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 15px;
        }

        .loading {
            width: 30px;
            height: 30px;
            border: 3px solid #dbeafe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
            margin: 15px auto;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="pagina">

        <section class="container">

            <div class="logo">
                Zora Vision
            </div>

            <h1>
                Pagamento via PIX
            </h1>

            <p class="descricao">
                Gere seu pagamento PIX com o Mercado Pago.
                Após o pagamento, seu pedido será processado.
            </p>

            <div
                id="status-pagamento"
                class="status"
            >
                <div class="loading"></div>
                Gerando seu PIX...
            </div>

            <div
                id="qr-container"
                class="qr-container"
            >

                <div
                    id="valor-pagamento"
                    class="valor"
                >
                    R$ 0,00
                </div>

                <div
                    id="numero-pedido"
                    class="pedido"
                >
                    Pedido: -
                </div>

                <img
                    id="qr-code"
                    src=""
                    alt="QR Code PIX"
                >

                <p
                    style="
                        font-size:14px;
                        color:#475569;
                        margin:15px 0 10px;
                    "
                >
                    Escaneie o QR Code com o aplicativo
                    do seu banco.
                </p>

                <label
                    class="pix-label"
                    for="codigo-pix"
                >
                    Ou copie o código PIX:
                </label>

                <textarea
                    id="codigo-pix"
                    class="pix-codigo"
                    readonly
                ></textarea>

                <button
                    type="button"
                    class="btn-copiar"
                    id="btn-copiar"
                >
                    Copiar código PIX
                </button>

                <button
                    type="button"
                    class="btn-voltar"
                    onclick="window.location.href='index.html'"
                >
                    Voltar para a loja
                </button>

            </div>

            <div
                id="erro-pagamento"
                class="erro"
            ></div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!--
        IMPORTANTE:
        Este arquivo precisa ser carregado antes deste HTML
        ou substituído pelas mesmas credenciais utilizadas
        no restante do seu projeto.
    -->

    <script>

        const URL_CRIAR_PIX =
            'https://ratajxnxkjoiuknamacn.supabase.co/functions/v1/criar-pix';


        function obterUsuario() {

            try {

                return JSON.parse(
                    localStorage.getItem('usuario_logado')
                );

            } catch (erro) {

                return null;
            }
        }


        function obterCarrinho() {

            const usuario =
                obterUsuario();

            if (!usuario || !usuario.email) {
                return [];
            }

            try {

                return JSON.parse(
                    localStorage.getItem(
                        'carrinho_' +
                        usuario.email.toLowerCase()
                    )
                ) || [];

            } catch (erro) {

                return [];
            }
        }


        function obterEndereco() {

            const usuario =
                obterUsuario();

            if (!usuario || !usuario.email) {
                return null;
            }

            try {

                return JSON.parse(
                    localStorage.getItem(
                        'ultimo_endereco_cliente_' +
                        usuario.email.toLowerCase()
                    )
                );

            } catch (erro) {

                return null;
            }
        }


        function calcularSubtotal(carrinho) {

            return carrinho.reduce(
                (total, item) => {

                    const preco =
                        Number(item.preco) || 0;

                    const quantidade =
                        Number(item.quantidade) || 0;

                    return total +
                        (preco * quantidade);

                },
                0
            );
        }


        async function gerarPix() {

            const status =
                document.getElementById(
                    'status-pagamento'
                );

            const erroBox =
                document.getElementById(
                    'erro-pagamento'
                );

            const qrContainer =
                document.getElementById(
                    'qr-container'
                );


            try {

                const usuario =
                    obterUsuario();


                if (
                    !usuario ||
                    !usuario.id ||
                    !usuario.email
                ) {

                    throw new Error(
                        'Usuário não está logado.'
                    );
                }


                const carrinho =
                    obterCarrinho();


                if (
                    !carrinho ||
                    carrinho.length === 0
                ) {

                    throw new Error(
                        'Seu carrinho está vazio.'
                    );
                }


                const endereco =
                    obterEndereco();


                if (
                    !endereco ||
                    !endereco.rua
                ) {

                    throw new Error(
                        'Endereço de entrega não encontrado.'
                    );
                }


                const subtotal =
                    calcularSubtotal(
                        carrinho
                    );


                const frete =
                    5.00;


                const desconto =
                    0;


                const total =
                    Math.max(
                        0,
                        subtotal -
                        desconto +
                        frete
                    );


                const numeroPedido =
                    String(
                        Math.floor(
                            10000 +
                            Math.random() *
                            90000
                        )
                    );


                const dados = {

                    cliente_id:
                        usuario.id,

                    email:
                        usuario.email,

                    nome:
                        usuario.nome ||
                        'Cliente',

                    endereco_id:
                        null,

                    numero_pedido:
                        numeroPedido,

                    subtotal:
                        subtotal,

                    frete:
                        frete,

                    desconto:
                        desconto,

                    valor:
                        total
                };


                console.log(
                    'Enviando dados para criar PIX:',
                    dados
                );


                const resposta =
                    await fetch(
                        URL_CRIAR_PIX,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body:
                                JSON.stringify(
                                    dados
                                )
                        }
                    );


                const resultado =
                    await resposta.json();


                console.log(
                    'Resposta da Edge Function:',
                    resultado
                );


                if (
                    !resposta.ok ||
                    !resultado.sucesso
                ) {

                    throw new Error(
                        resultado.error ||
                        'Não foi possível gerar o PIX.'
                    );
                }


                if (
                    !resultado.qr_code_base64 &&
                    !resultado.qr_code
                ) {

                    throw new Error(
                        'O Mercado Pago não retornou o QR Code.'
                    );
                }


                localStorage.setItem(
                    'ultimo_pedido_salvo',
                    JSON.stringify({
                        id:
                            resultado.pedido_id,

                        numero:
                            '#' +
                            numeroPedido,

                        pagamento:
                            'PIX',

                        status:
                            'pendente',

                        status_pagamento:
                            'pendente',

                        subtotal:
                            subtotal,

                        frete:
                            frete,

                        desconto:
                            desconto,

                        total:
                            total,

                        itens:
                            carrinho,

                        endereco:
                            endereco,

                        pagamento_id:
                            resultado.pagamento_id
                    })
                );


                document.getElementById(
                    'valor-pagamento'
                ).textContent =
                    `R$ ${total
                        .toFixed(2)
                        .replace('.', ',')}`;


                document.getElementById(
                    'numero-pedido'
                ).textContent =
                    `Pedido: #${numeroPedido}`;


                const qrCode =
                    document.getElementById(
                        'qr-code'
                    );


                if (
                    resultado.qr_code_base64
                ) {

                    qrCode.src =
                        `data:image/png;base64,${resultado.qr_code_base64}`;

                } else {

                    /*
                        Fallback caso o Mercado Pago
                        retorne somente o código PIX.
                    */

                    qrCode.src =
                        'https://quickchart.io/qr?text=' +
                        encodeURIComponent(
                            resultado.qr_code
                        ) +
                        '&size=300';
                }


                document.getElementById(
                    'codigo-pix'
                ).value =
                    resultado.qr_code || '';


                status.style.display =
                    'none';


                qrContainer.style.display =
                    'flex';


                erroBox.style.display =
                    'none';


            } catch (erro) {

                console.error(
                    'ERRO AO GERAR PIX:',
                    erro
                );


                status.style.display =
                    'none';


                erroBox.style.display =
                    'block';


                erroBox.textContent =
                    erro.message ||
                    'Não foi possível gerar o pagamento PIX.';
            }
        }


        document
            .getElementById('btn-copiar')
            .addEventListener(
                'click',
                async () => {

                    const campo =
                        document.getElementById(
                            'codigo-pix'
                        );

                    const botao =
                        document.getElementById(
                            'btn-copiar'
                        );


                    if (!campo.value) {
                        return;
                    }


                    try {

                        await navigator
                            .clipboard
                            .writeText(
                                campo.value
                            );


                        botao.textContent =
                            'Código copiado! ✓';


                        botao.style.background =
                            '#16a34a';


                        setTimeout(
                            () => {

                                botao.textContent =
                                    'Copiar código PIX';

                                botao.style.background =
                                    '';

                            },
                            2000
                        );


                    } catch (erro) {

                        campo.select();

                        document.execCommand(
                            'copy'
                        );

                        botao.textContent =
                            'Código copiado! ✓';
                    }
                }
            );


        document.addEventListener(
            'DOMContentLoaded',
            () => {

                gerarPix();

            }
        );

    </script>

</body>

</html>
