
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento PIX - Zora Vision</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        .pagina {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .descricao {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .status {
            padding: 14px;
            border-radius: 10px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .status.aprovado {
            background: #f0fdf4;
            color: #16a34a;
        }

        .status.erro {
            background: #fef2f2;
            color: #dc2626;
        }

        .qr-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .qr-container img {
            width: 260px;
            height: 260px;
            object-fit: contain;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            background: #ffffff;
        }

        .valor {
            font-size: 25px;
            font-weight: 800;
            color: #16a34a;
            margin: 20px 0;
        }

        .pedido {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .pix-label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .pix-codigo {
            width: 100%;
            min-height: 100px;
            resize: none;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 12px;
            font-size: 12px;
            color: #334155;
            background: #f8fafc;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-copiar {
            background: #2563eb;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .btn-copiar:hover {
            background: #1d4ed8;
        }

        .btn-voltar {
            background: #f1f5f9;
            color: #334155;
        }

        .btn-confirmado {
            background: #16a34a;
            color: #ffffff;
            margin-top: 12px;
        }

        .btn-confirmado:hover {
            background: #15803d;
        }

        .erro-box {
            display: none;
            padding: 14px;
            border-radius: 10px;
            background: #fef2f2;
            color: #dc2626;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 15px;
        }

        .loading {
            width: 30px;
            height: 30px;
            border: 3px solid #dbeafe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
            margin: 15px auto;
        }

        .loading-verificacao {
            width: 18px;
            height: 18px;
            border: 2px solid #dbeafe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="pagina">

        <section class="container">

            <div class="logo">
                Zora Vision
            </div>

            <h1 id="titulo-pagina">
                Pagamento via PIX
            </h1>

            <p
                id="descricao-pagina"
                class="descricao"
            >
                Faça o pagamento utilizando o QR Code
                ou copie o código PIX abaixo.
            </p>

            <div
                id="status-pagamento"
                class="status"
            >
                <div class="loading"></div>
                Carregando pagamento...
            </div>

            <div
                id="qr-container"
                class="qr-container"
            >

                <div
                    id="valor-pagamento"
                    class="valor"
                >
                    R$ 0,00
                </div>

                <div
                    id="numero-pedido"
                    class="pedido"
                >
                    Pedido: -
                </div>

                <img
                    id="qr-code"
                    src=""
                    alt="QR Code PIX"
                >

                <p
                    style="
                        font-size:14px;
                        color:#475569;
                        margin:15px 0 10px;
                    "
                >
                    Escaneie o QR Code com o aplicativo
                    do seu banco.
                </p>

                <label
                    class="pix-label"
                    for="codigo-pix"
                >
                    Ou copie o código PIX:
                </label>

                <textarea
                    id="codigo-pix"
                    class="pix-codigo"
                    readonly
                ></textarea>

                <button
                    type="button"
                    class="btn-copiar"
                    id="btn-copiar"
                >
                    Copiar código PIX
                </button>

                <button
                    type="button"
                    class="btn-voltar"
                    onclick="window.location.href='index.html'"
                >
                    Voltar para a loja
                </button>

            </div>

            <div
                id="erro-pagamento"
                class="erro-box"
            ></div>

        </section>

    </main>


    <script>

        /*
        ============================================================
        CONFIGURAÇÃO
        ============================================================
        */

        const SUPABASE_URL =
            'https://ratajxnxkjoiuknamacn.supabase.co';

        const FUNCAO_VERIFICAR_PIX =
            `${SUPABASE_URL}/functions/v1/verificar-pagamento-pix`;

        const INTERVALO_VERIFICACAO =
            5000;


        /*
        ============================================================
        CONTROLE
        ============================================================
        */

        let intervaloPagamento = null;

        let pagamentoAprovado = false;


        /*
        ============================================================
        ELEMENTOS
        ============================================================
        */

        const status =
            document.getElementById(
                'status-pagamento'
            );

        const erroBox =
            document.getElementById(
                'erro-pagamento'
            );

        const qrContainer =
            document.getElementById(
                'qr-container'
            );


        /*
        ============================================================
        MOSTRAR STATUS
        ============================================================
        */

        function mostrarStatus(
            mensagem,
            tipo = ''
        ) {

            status.className =
                'status';

            if (tipo) {
                status.classList.add(tipo);
            }

            status.innerHTML =
                mensagem;

            status.style.display =
                'block';
        }


        /*
        ============================================================
        CARREGAR PAGAMENTO PIX
        ============================================================
        */

        function carregarPagamentoPix() {

            try {

                const pagamentoSalvo =
                    localStorage.getItem(
                        'pagamento_pix_atual'
                    );

                const pedidoSalvo =
                    localStorage.getItem(
                        'pedido_pix_atual'
                    );


                /*
                ----------------------------------------------------
                PAGAMENTO NÃO ENCONTRADO
                ----------------------------------------------------
                */

                if (!pagamentoSalvo) {

                    throw new Error(
                        'Pagamento PIX não encontrado. Volte ao checkout e tente novamente.'
                    );
                }


                /*
                ----------------------------------------------------
                CONVERTER PAGAMENTO
                ----------------------------------------------------
                */

                const pagamento =
                    JSON.parse(
                        pagamentoSalvo
                    );


                /*
                ----------------------------------------------------
                CONVERTER PEDIDO
                ----------------------------------------------------
                */

                let pedido = null;

                if (pedidoSalvo) {

                    try {

                        pedido =
                            JSON.parse(
                                pedidoSalvo
                            );

                    } catch {

                        pedido = null;
                    }
                }


                console.log(
                    'PAGAMENTO PIX:',
                    pagamento
                );

                console.log(
                    'PEDIDO:',
                    pedido
                );


                /*
                ----------------------------------------------------
                VALOR
                ----------------------------------------------------
                */

                const valor =
                    Number(
                        pedido?.total ||
                        pagamento?.total ||
                        0
                    );


                document.getElementById(
                    'valor-pagamento'
                ).textContent =
                    `R$ ${valor
                        .toFixed(2)
                        .replace('.', ',')}`;


                /*
                ----------------------------------------------------
                PEDIDO ID
                ----------------------------------------------------
                */

                const pedidoId =
                    pedido?.id ||
                    pagamento?.pedido_id ||
                    null;


                /*
                ----------------------------------------------------
                NÚMERO DO PEDIDO
                ----------------------------------------------------
                */

                const numeroPedido =
                    pedido?.numero_pedido ||
                    pagamento?.numero_pedido ||
                    pedido?.numero ||
                    pagamento?.pedido_id ||
                    '-';


                document.getElementById(
                    'numero-pedido'
                ).textContent =
                    `Pedido: ${
                        String(numeroPedido).startsWith('#')
                            ? numeroPedido
                            : '#' + numeroPedido
                    }`;


                /*
                ----------------------------------------------------
                SALVAR PEDIDO ID
                ----------------------------------------------------
                */

                if (pedidoId) {

                    localStorage.setItem(
                        'pedido_id_pix_verificacao',
                        pedidoId
                    );

                }


                /*
                ----------------------------------------------------
                QR CODE
                ----------------------------------------------------
                */

                const qrCode =
                    document.getElementById(
                        'qr-code'
                    );


                if (
                    pagamento.qr_code_base64
                ) {

                    qrCode.src =
                        `data:image/png;base64,${pagamento.qr_code_base64}`;

                } else if (
                    pagamento.qr_code
                ) {

                    qrCode.src =
                        'https://quickchart.io/qr?text=' +
                        encodeURIComponent(
                            pagamento.qr_code
                        ) +
                        '&size=300';

                } else {

                    throw new Error(
                        'O pagamento não possui QR Code.'
                    );
                }


                /*
                ----------------------------------------------------
                CÓDIGO PIX
                ----------------------------------------------------
                */

                document.getElementById(
                    'codigo-pix'
                ).value =
                    pagamento.qr_code || '';


                /*
                ----------------------------------------------------
                MOSTRAR PIX
                ----------------------------------------------------
                */

                status.style.display =
                    'none';

                qrContainer.style.display =
                    'flex';

                erroBox.style.display =
                    'none';


                /*
                ----------------------------------------------------
                INICIAR VERIFICAÇÃO
                ----------------------------------------------------
                */

                if (pedidoId) {

                    verificarPagamento(
                        pedidoId
                    );

                } else {

                    console.warn(
                        'PEDIDO ID NÃO ENCONTRADO. Não será possível verificar automaticamente.'
                    );

                }

            } catch (erro) {

                console.error(
                    'ERRO AO CARREGAR PIX:',
                    erro
                );

                mostrarErro(
                    erro.message ||
                    'Não foi possível carregar o pagamento PIX.'
                );
            }
        }


        /*
        ============================================================
        VERIFICAR PAGAMENTO
        ============================================================
        */

        async function verificarPagamento(
            pedidoId
        ) {

            if (
                !pedidoId ||
                pagamentoAprovado
            ) {

                return;
            }


            try {

                console.log(
                    'VERIFICANDO PAGAMENTO PIX...',
                    pedidoId
                );


                const resposta =
                    await fetch(
                        FUNCAO_VERIFICAR_PIX,
                        {

                            method:
                                'POST',

                            headers: {

                                'Content-Type':
                                    'application/json'

                            },

                            body:
                                JSON.stringify({

                                    pedido_id:
                                        pedidoId

                                })

                        }
                    );


                /*
                ----------------------------------------------------
                RESPOSTA NÃO OK
                ----------------------------------------------------
                */

                if (!resposta.ok) {

                    const texto =
                        await resposta.text();

                    console.error(
                        'ERRO EDGE FUNCTION:',
                        resposta.status,
                        texto
                    );

                    throw new Error(
                        `Erro ao verificar pagamento. HTTP ${resposta.status}`
                    );
                }


                /*
                ----------------------------------------------------
                JSON
                ----------------------------------------------------
                */

                const resultado =
                    await resposta.json();


                console.log(
                    'RESPOSTA DA VERIFICAÇÃO PIX:',
                    resultado
                );


                /*
                ----------------------------------------------------
                PEDIDO NÃO ENCONTRADO
                ----------------------------------------------------
                */

                if (
                    resultado.encontrado === false
                ) {

                    throw new Error(
                        'Pedido não encontrado no Supabase.'
                    );
                }


                /*
                ----------------------------------------------------
                PAGAMENTO APROVADO
                ----------------------------------------------------
                */

                if (
                    resultado.pago === true
                ) {

                    pagamentoAprovado =
                        true;


                    pararVerificacao();


                    mostrarPagamentoAprovado(
                        resultado
                    );


                    return;
                }


                /*
                ----------------------------------------------------
                PAGAMENTO AINDA PENDENTE
                ----------------------------------------------------
                */

                mostrarStatus(

                    '<span class="loading-verificacao"></span>' +
                    'Aguardando confirmação do pagamento...'

                );


                /*
                ----------------------------------------------------
                CONTINUAR VERIFICANDO
                ----------------------------------------------------
                */

                if (!intervaloPagamento) {

                    intervaloPagamento =
                        setInterval(
                            () => {

                                verificarPagamento(
                                    pedidoId
                                );

                            },
                            INTERVALO_VERIFICACAO
                        );
                }


            } catch (erro) {

                console.error(
                    'ERRO NA VERIFICAÇÃO DO PAGAMENTO:',
                    erro
                );


                /*
                ----------------------------------------------------
                NÃO INTERROMPER A VERIFICAÇÃO
                ----------------------------------------------------
                */

                if (!intervaloPagamento) {

                    intervaloPagamento =
                        setInterval(
                            () => {

                                verificarPagamento(
                                    pedidoId
                                );

                            },
                            INTERVALO_VERIFICACAO
                        );
                }
            }
        }


        /*
        ============================================================
        PARAR VERIFICAÇÃO
        ============================================================
        */

        function pararVerificacao() {

            if (intervaloPagamento) {

                clearInterval(
                    intervaloPagamento
                );

                intervaloPagamento =
                    null;
            }
        }


        /*
        ============================================================
        PAGAMENTO APROVADO
        ============================================================
        */

        function mostrarPagamentoAprovado(
            resultado
        ) {

            qrContainer.style.display =
                'none';

            erroBox.style.display =
                'none';


            document.getElementById(
                'titulo-pagina'
            ).textContent =
                'Pagamento aprovado!';


            document.getElementById(
                'descricao-pagina'
            ).textContent =
                'Seu pagamento PIX foi confirmado com sucesso.';


            mostrarStatus(

                `
                <strong style="font-size:18px;">
                    ✓ Pagamento aprovado
                </strong>
                <br><br>
                Pedido:
                #${resultado.numero_pedido || '-'}
                `,

                'aprovado'
            );


            /*
            --------------------------------------------------------
            ATUALIZAR LOCALSTORAGE
            --------------------------------------------------------
            */

            try {

                const pedidoSalvo =
                    localStorage.getItem(
                        'pedido_pix_atual'
                    );

                if (pedidoSalvo) {

                    const pedido =
                        JSON.parse(
                            pedidoSalvo
                        );

                    pedido.status =
                        resultado.status ||
                        pedido.status;

                    pedido.status_pagamento =
                        resultado.status_pagamento ||
                        pedido.status_pagamento;

                    localStorage.setItem(
                        'pedido_pix_atual',
                        JSON.stringify(
                            pedido
                        )
                    );
                }

            } catch (erro) {

                console.warn(
                    'Não foi possível atualizar pedido local:',
                    erro
                );
            }


            /*
            --------------------------------------------------------
            REDIRECIONAR
            --------------------------------------------------------
            */

            setTimeout(
                () => {

                    window.location.href =
                        'pedido-confirmado.html';

                },
                2000
            );
        }


        /*
        ============================================================
        MOSTRAR ERRO
        ============================================================
        */

        function mostrarErro(
            mensagem
        ) {

            status.style.display =
                'none';

            qrContainer.style.display =
                'none';

            erroBox.style.display =
                'block';

            erroBox.textContent =
                mensagem;
        }


        /*
        ============================================================
        COPIAR PIX
        ============================================================
        */

        document
            .getElementById('btn-copiar')
            .addEventListener(
                'click',
                async () => {

                    const campo =
                        document.getElementById(
                            'codigo-pix'
                        );

                    const botao =
                        document.getElementById(
                            'btn-copiar'
                        );


                    if (!campo.value) {

                        alert(
                            'Código PIX não disponível.'
                        );

                        return;
                    }


                    try {

                        await navigator
                            .clipboard
                            .writeText(
                                campo.value
                            );


                        botao.textContent =
                            'Código copiado! ✓';

                        botao.style.background =
                            '#16a34a';


                        setTimeout(
                            () => {

                                botao.textContent =
                                    'Copiar código PIX';

                                botao.style.background =
                                    '';

                            },
                            2000
                        );


                    } catch (erro) {

                        campo.select();

                        document.execCommand(
                            'copy'
                        );


                        botao.textContent =
                            'Código copiado! ✓';


                        setTimeout(
                            () => {

                                botao.textContent =
                                    'Copiar código PIX';

                            },
                            2000
                        );
                    }
                }
            );


        /*
        ============================================================
        INICIAR
        ============================================================
        */

        document.addEventListener(
            'DOMContentLoaded',
            () => {

                carregarPagamentoPix();

            }
        );


        /*
        ============================================================
        LIMPAR INTERVALO AO SAIR
        ============================================================
        */

        window.addEventListener(
            'beforeunload',
            () => {

                pararVerificacao();

            }
        );

    </script>

</body>

</html>
