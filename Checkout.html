<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra - E-commerce</title>

  <!-- ESTILOS CSS -->
  <link rel="stylesheet" href="Folha-estilos/Checkout.css">
</head>
<body>

  <!-- ========================================== -->
  <!-- CABEÇALHO DA PÁGINA                       -->
  <!-- ========================================== -->
  <header class="header">
    <a href="carrinho.html" class="btn-voltar" title="Voltar ao carrinho">&#8592;</a>
    <h1 class="header-titulo">Finalizar Compra</h1>
    <div class="header-espaco"></div>
  </header>

  <!-- ========================================== -->
  <!-- CONTEÚDO PRINCIPAL DO CHECKOUT             -->
  <!-- ========================================== -->
  <main class="checkout-container">

    <!-- SEÇÃO: ENDEREÇO DE ENTREGA (DINÂMICO) -->
    <section class="secao-card">
      <div class="secao-topo">
        <h2 class="secao-titulo">📍 Endereço de Entrega</h2>
      </div>

      <!-- OPÇÃO A: CARD EXIBIDO QUANDO JÁ EXISTE ENDEREÇO SALVO -->
      <div id="box-endereco-cadastrado" style="display: none; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; margin-top: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div>
            <strong id="card-end-nome" style="display: block; font-size: 15px; color: #0f172a; margin-bottom: 4px;">-</strong>
            <p id="card-end-rua-num" style="font-size: 14px; color: #334155; margin: 0;">-</p>
            <p id="card-end-bairro-cidade" style="font-size: 13px; color: #64748b; margin: 2px 0 0 0;">-</p>
            <p id="card-end-cep" style="font-size: 12px; color: #2563eb; margin-top: 4px; font-weight: bold;">-</p>
          </div>
          <button type="button" onclick="alternarFormularioEndereco(true)" style="background: none; border: none; color: #2563eb; font-weight: bold; font-size: 13px; cursor: pointer; text-decoration: underline;">
            Alterar endereço
          </button>
        </div>
      </div>

      <!-- OPÇÃO B: FORMULÁRIO EXIBIDO SE NÃO HOUVER ENDEREÇO OU SE O CLIENTE CLICAR EM ALTERAR -->
      <form id="form-endereco" style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <small style="color: #64748b;">Preencha os dados abaixo para entrega:</small>
          <!-- Botão para cancelar a alteração caso o cliente já tenha um endereço salvo -->
          <button type="button" id="btn-cancelar-alteracao" onclick="alternarFormularioEndereco(false)" style="display: none; background: none; border: none; color: #ef4444; font-size: 12px; cursor: pointer;">Cancelar</button>
        </div>

        <!-- NOME COMPLETO -->
        <div>
          <label style="font-size: 12px; color: #475569; font-weight: bold; display: block; margin-bottom: 4px;">Nome Completo:</label>
          <input type="text" id="end-nome" placeholder="Ex: João Silva" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
        </div>

        <!-- CEP COM BUSCA AUTOMÁTICA -->
        <div>
          <label style="font-size: 12px; color: #475569; font-weight: bold; display: block; margin-bottom: 4px;">CEP:</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="end-cep" maxlength="9" placeholder="74230-100" required style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
            <button type="button" onclick="buscarCEP()" style="background: #2563eb; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;">Buscar CEP</button>
          </div>
          <span id="cep-status" style="font-size: 11px; margin-top: 4px; display: block;"></span>
        </div>

        <!-- RUA / LOGRADOURO -->
        <div>
          <label style="font-size: 12px; color: #475569; font-weight: bold; display: block; margin-bottom: 4px;">Rua / Endereço:</label>
          <input type="text" id="end-rua" placeholder="Rua, Av., Quadra..." required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
        </div>

        <!-- NÚMERO E COMPLEMENTO -->
        <div style="display: flex; gap: 10px;">
          <div style="flex: 1;">
            <label style="font-size: 12px; color: #475569; font-weight: bold; display: block; margin-bottom: 4px;">Número:</label>
            <input type="text" id="end-numero" placeholder="1020" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
          </div>
          <div style="flex: 1;">
            <label style="font-size: 12px; color: #475569; font-weight: bold; display: block; margin-bottom: 4px;">Complemento:</label>
            <input type="text" id="end-complemento" placeholder="Apto 101, Q. 12" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
          </div>
        </div>

        <!-- BAIRRO, CIDADE E UF -->
        <div style="display: flex; gap: 10px;">
          <div style="flex: 2;">
            <label style="font-size: 12px; color: #475569; font-weight: bold; display: block; margin-bottom: 4px;">Bairro:</label>
            <input type="text" id="end-bairro" placeholder="Setor Bueno" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
          </div>
          <div style="flex: 2;">
            <label style="font-size: 12px; color: #475569; font-weight: bold; display: block; margin-bottom: 4px;">Cidade:</label>
            <input type="text" id="end-cidade" placeholder="Goiânia" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box;">
          </div>
          <div style="flex: 1;">
            <label style="font-size: 12px; color: #475569; font-weight: bold; display: block; margin-bottom: 4px;">UF:</label>
            <input type="text" id="end-uf" placeholder="GO" maxlength="2" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; text-transform: uppercase; box-sizing: border-box;">
          </div>
        </div>

      </form>
    </section>

    <!-- SEÇÃO: FORMAS DE PAGAMENTO -->
    <section class="secao-card">
      <h2 class="secao-titulo">💳 Forma de Pagamento</h2>

      <div class="opcoes-pagamento">
        <label class="pagamento-item">
          <input type="radio" name="pagamento" value="pix" checked>
          <div class="pagamento-info">
            <div class="pagamento-nome">
              <span>PIX</span>
              <span class="badge-desconto">5% OFF</span>
            </div>
            <span class="pagamento-subtexto">Aprovação instantânea</span>
          </div>
          <span class="pagamento-icone">⚡</span>
        </label>

        <label class="pagamento-item">
          <input type="radio" name="pagamento" value="cartao">
          <div class="pagamento-info">
            <div class="pagamento-nome">Cartão de Crédito</div>
            <span class="pagamento-subtexto">Em até 12x no cartão</span>
          </div>
          <span class="pagamento-icone">💳</span>
        </label>

        <label class="pagamento-item">
          <input type="radio" name="pagamento" value="boleto">
          <div class="pagamento-info">
            <div class="pagamento-nome">Boleto Bancário</div>
            <span class="pagamento-subtexto">Vencimento em 2 dias úteis</span>
          </div>
          <span class="pagamento-icone">📄</span>
        </label>
      </div>
    </section>

    <!-- SEÇÃO: ITENS DO PEDIDO (INJETADOS VIA JAVASCRIPT) -->
    <section class="secao-card">
      <h2 class="secao-titulo" id="chk-titulo-itens">📦 Itens do Pedido</h2>
      <div class="itens-resumo" id="chk-lista-itens"></div>
    </section>

    <!-- SEÇÃO: RESUMO DE VALORES -->
    <section class="secao-card resumo-valores">
      <div class="linha-valor">
        <span>Subtotal</span>
        <span id="chk-subtotal">R$ 0,00</span>
      </div>
      <div class="linha-valor">
        <span>Frete</span>
        <span class="frete-valor" id="chk-frete">R$ 5,00</span>
      </div>
      <hr class="divisor-resumo">
      <div class="linha-valor total">
        <span>Total a Pagar</span>
        <span class="valor-final" id="chk-total">R$ 0,00</span>
      </div>
    </section>

    <!-- BOTÃO FINALIZAR COMPRA -->
    <div class="checkout-acao">
      <button type="button" onclick="validarEConfirmarPedido()" class="btn-finalizar" style="width: 100%; background: #16a34a; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">
        Confirmar e Pagar 🚀
      </button>
    </div>

  </main>

  <!-- ========================================== -->
  <!-- SCRIPT JS PRINCIPAL                        -->
  <!-- ========================================== -->
  <script src="Scripts/Carrinho-checkout.js"></script>
</body>
</html>
