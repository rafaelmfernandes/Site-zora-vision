  Meus Dados e Senha

<div class="header-espaco"></div>


  </header>

  <!-- ============================================================
       CONTEÚDO
  ============================================================ -->

  <main class="container">

<!-- ==========================================================
     DADOS PESSOAIS
=========================================================== -->

<section class="card-secao">

  <h2 class="secao-titulo">
    📍 Dados Pessoais
  </h2>


  <!-- ========================================================
       FOTO DE PERFIL
  ========================================================= -->

  <div
    class="foto-perfil-container"
    style="
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      margin-bottom:25px;
    "
  >

    <div
      id="foto-perfil-preview"
      style="
        width:110px;
        height:110px;
        border-radius:50%;
        overflow:hidden;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#f1f5f9;
        border:3px solid #e2e8f0;
        font-size:42px;
        color:#64748b;
      "
    >
      👤
    </div>


    <input
      type="file"
      id="foto-perfil"
      accept="image/jpeg,image/png,image/webp"
      style="display:none;"
    >


    <div
      style="
        display:flex;
        gap:10px;
        margin-top:12px;
        flex-wrap:wrap;
        justify-content:center;
      "
    >

      <button
        type="button"
        id="btn-alterar-foto"
        style="
          padding:9px 16px;
          border:none;
          border-radius:8px;
          cursor:pointer;
          font-weight:600;
        "
      >
        📷 Alterar foto
      </button>


      <button
        type="button"
        id="btn-remover-foto"
        style="
          padding:9px 16px;
          border:none;
          border-radius:8px;
          cursor:pointer;
          font-weight:600;
          display:none;
        "
      >
        🗑️ Remover foto
      </button>

    </div>


    <small
      style="
        margin-top:8px;
        color:#64748b;
        text-align:center;
      "
    >
      JPG, PNG ou WEBP. Tamanho máximo recomendado: 5 MB.
    </small>

  </div>


  <form
    class="form-dados"
    id="form-dados"
  >

    <div class="campo">

      <label for="nome">
        Nome Completo
      </label>

      <input
        type="text"
        id="nome"
        autocomplete="name"
        required
      >

    </div>


    <div class="campo">

      <label for="email">
        E-mail
      </label>

      <input
        type="email"
        id="email"
        autocomplete="email"
        required
      >

    </div>


    <div class="campo">

      <label for="telefone">
        Telefone / WhatsApp
      </label>

      <input
        type="tel"
        id="telefone"
        autocomplete="tel"
      >

    </div>


    <div class="campo">

      <label for="cpf">
        CPF
      </label>

      <input
        type="text"
        id="cpf"
        placeholder="000.000.000-00"
        inputmode="numeric"
        autocomplete="off"
        maxlength="14"
      >

    </div>


    <button
      type="submit"
      class="btn-salvar"
    >
      Salvar Alterações
    </button>

  </form>

</section>


<!-- ==========================================================
     ALTERAR SENHA
=========================================================== -->

<section class="card-secao">

  <h2 class="secao-titulo">
    🔒 Alterar Senha
  </h2>

  <form
    class="form-dados"
    id="form-senha"
  >

    <div class="campo">

      <label for="senha-atual">
        Senha Atual
      </label>

      <input
        type="password"
        id="senha-atual"
        placeholder="Digite sua senha atual"
        autocomplete="current-password"
        required
      >

    </div>


    <div class="campo">

      <label for="nova-senha">
        Nova Senha
      </label>

      <input
        type="password"
        id="nova-senha"
        placeholder="No mínimo 8 caracteres"
        autocomplete="new-password"
        minlength="8"
        required
      >

    </div>


    <div class="campo">

      <label for="confirmar-senha">
        Confirmar Nova Senha
      </label>

      <input
        type="password"
        id="confirmar-senha"
        placeholder="Repita a nova senha"
        autocomplete="new-password"
        minlength="8"
        required
      >

    </div>


    <button
      type="submit"
      class="btn-salvar btn-seguranca"
    >
      Atualizar Senha
    </button>

  </form>

</section>
