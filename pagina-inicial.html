<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página inicial</title>
<link rel="stylesheet" href="Folha-estilos/pagina-inicial.css">
</head>
<body>

  <header class="topo">
    <div class="logo">Sua Logo</div>

    <div class="direita">
      <button class="btn-icone" type="button" aria-label="Pesquisar" id="btnPesquisar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <button class="btn-icone" type="button" aria-label="Notificações">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="badge-notificacao"></span>
      </button>
    </div>
  </header>

  <div class="barra-pesquisa" id="barraPesquisa">
    <form action="#" onsubmit="return false;">
      <input type="text" placeholder="O que você está procurando?" id="campoPesquisa">
      <button type="submit">Buscar</button>
    </form>
  </div>

  <main class="conteudo">

    <div class="banner">
      Banner de destaque aqui
    </div>

    <section class="secao-produtos">
      <h2>Produtos</h2>
      <div class="grade-produtos" id="gradeProdutos"></div>
    </section>

  </main>

  <nav class="menu-inferior">
    <a class="menu-inferior-item ativo" href="pagina-inicial.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5"></path>
        <path d="M5 9.5V21h14V9.5"></path>
      </svg>
      Home
    </a>

    <a class="menu-inferior-item" href="carrinho.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="20" r="1.5"></circle>
        <circle cx="18" cy="20" r="1.5"></circle>
        <path d="M2 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 7H6"></path>
      </svg>
      Carrinho
    </a>

    <a class="menu-inferior-item" href="perfil.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
      </svg>
      Perfil
    </a>
  </nav>

  <script>
    const btnPesquisar = document.getElementById('btnPesquisar');
    const barraPesquisa = document.getElementById('barraPesquisa');
    const campoPesquisa = document.getElementById('campoPesquisa');

    btnPesquisar.addEventListener('click', () => {
      barraPesquisa.classList.toggle('aberta');
      if (barraPesquisa.classList.contains('aberta')) {
        campoPesquisa.focus();
      }
    });

    /*
      Lista de produtos.
      Aqui você vai colocar os produtos cadastrados na página
      "cadastro-produto.html" — por enquanto são dados de exemplo,
      no formato que o formulário de cadastro deve gerar (nome, preço, imagem).
    */
    const produtos = [
      { nome: "Vaso decorativo cerâmica", preco: "R$ 89,90", imagem: "" },
      { nome: "Kit caixas organizadoras", preco: "R$ 64,90", imagem: "" },
      { nome: "Porta-retrato madeira", preco: "R$ 39,90", imagem: "" },
      { nome: "Luminária de mesa", preco: "R$ 129,90", imagem: "" }
    ];

    const gradeProdutos = document.getElementById('gradeProdutos');

    function renderizarProdutos(lista) {
      gradeProdutos.innerHTML = "";
      lista.forEach(produto => {
        const card = document.createElement('div');
        card.className = 'produto-card';

        const imagemHtml = produto.imagem
          ? `<img src="${produto.imagem}" alt="${produto.nome}" style="width:100%; height:100%; object-fit: cover;">`
          : 'sem imagem';

        card.innerHTML = `
          <div class="produto-imagem">${imagemHtml}</div>
          <div class="produto-info">
            <p class="produto-nome">${produto.nome}</p>
            <p class="produto-preco">${produto.preco}</p>
          </div>
        `;

        gradeProdutos.appendChild(card);
      });
    }

    renderizarProdutos(produtos);
  </script>

</body>
</html>
