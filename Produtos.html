<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto - SuaLoja.com</title>
    <!-- Caminho atualizado para a pasta Folha-estilos -->
    <link rel="stylesheet" href="Folha-estilos/Produtos.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="index.html" class="btn-voltar">←</a>
        <h1 class="header-titulo">Detalhes do Produto</h1>
        <button class="btn-favorito" aria-label="Favoritar">🤍</button>
    </header>

    <!-- Galeria -->
    <section class="galeria-box">
        <div class="imagem-principal" id="prod-img">🎧</div>
    </section>

    <!-- Detalhes do Produto -->
    <section class="detalhes-header">
        <h2 class="produto-titulo" id="prod-titulo">Carregando produto...</h2>
        
        <div class="avaliacao-resumo">
            <span class="estrelas">★★★★★</span>
            <span class="nota">4.8</span>
            <span class="total-avaliacoes">(124 avaliações)</span>
        </div>

        <div class="preco-estoque-box">
            <div class="preco-box">
                <span class="preco-de">R$ 249,90</span>
                <span class="preco-por" id="prod-preco">R$ 0,00</span>
            </div>
            <div class="estoque-tag">
                <span class="dot"></span> Em estoque
            </div>
        </div>
    </section>

    <!-- Seção de Quantidade -->
    <section class="secao-quantidade">
        <span class="qtd-label">Quantidade</span>
        <div class="seletor-qtd">
            <button class="btn-qtd" id="btn-diminuir">-</button>
            <input type="number" class="input-qtd" id="input-qtd" value="1" min="1" readonly>
            <button class="btn-qtd" id="btn-aumentar">+</button>
        </div>
    </section>

    <!-- Descrição -->
    <section class="secao-info">
        <h3 class="secao-titulo">Descrição do Produto</h3>
        <p class="descricao-texto" id="prod-descricao">
            Carregando descrição do produto...
        </p>
    </section>

    <!-- Avaliações / Comentários -->
    <section class="secao-info">
        <div class="secao-cabecalho">
            <h3 class="secao-titulo">Avaliações de Clientes</h3>
            <a href="#" class="link-ver-todos">Ver todas</a>
        </div>
        <div class="comentarios-lista" id="prod-comentarios">
            <!-- Injetado dinamicamente via JS (Exibe comentários ou aviso padrão) -->
        </div>
    </section>

    <!-- Produtos Relacionados -->
    <section class="secao-info">
        <h3 class="secao-titulo">Quem viu este, também comprou</h3>
        <div class="produtos-grid" id="prod-relacionados">
            <!-- Injetado dinamicamente via JS -->
        </div>
    </section>

    <!-- Barra Dupla de Compra Fixa -->
    <div class="barra-compra-fixa">
        <button class="btn-carrinho" id="add-carrinho-detalhes">Adicionar ao Carrinho</button>
        <button class="btn-comprar" id="comprar-agora">Comprar Agora</button>
    </div>

    <!-- Menu Inferior de Navegação -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">🔔</span>
            <span>Avisos</span>
        </a>
        <a href="carrinho.html" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span class="carrinho-badge">0</span>
            <span>Carrinho</span>
        </a>
        <a href="Meu-perfil.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Entrar</span>
        </a>
    </nav>

    <!-- Importação do Script da pasta Scripts -->
    <script src="Scripts/carrinho-checkout.js"></script>

    <!-- Script Interno para Controles da Página de Detalhes -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnDiminuir = document.getElementById('btn-diminuir');
            const btnAumentar = document.getElementById('btn-aumentar');
            const inputQtd = document.getElementById('input-qtd');

            if (btnDiminuir && btnAumentar && inputQtd) {
                btnDiminuir.addEventListener('click', () => {
                    let qtd = parseInt(inputQtd.value);
                    if (qtd > 1) inputQtd.value = qtd - 1;
                });

                btnAumentar.addEventListener('click', () => {
                    let qtd = parseInt(inputQtd.value);
                    inputQtd.value = qtd + 1;
                });
            }

            // Ação do Botão Adicionar ao Carrinho com a Quantidade Selecionada
            const btnAddDetalhes = document.getElementById('add-carrinho-detalhes');
            if (btnAddDetalhes) {
                btnAddDetalhes.addEventListener('click', () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const id = urlParams.get('id') || 'fone-01';
                    const produto = PRODUTOS_BD[id];

                    if (produto) {
                        const qtd = parseInt(inputQtd.value);
                        for (let i = 0; i < qtd; i++) {
                            CarrinhoCheckoutModule.adicionarProduto({
                                id: produto.id,
                                nome: produto.nome,
                                preco: parseFloat(produto.preco)
                            });
                        }

                        btnAddDetalhes.textContent = 'Adicionado! ✓';
                        btnAddDetalhes.style.backgroundColor = '#10b981';
                        btnAddDetalhes.style.color = '#ffffff';

                        setTimeout(() => {
                            btnAddDetalhes.textContent = 'Adicionar ao Carrinho';
                            btnAddDetalhes.style.backgroundColor = '';
                            btnAddDetalhes.style.color = '';
                        }, 1200);
                    }
                });
            }

            // Botão Comprar Agora (Adiciona e vai direto para o Carrinho)
            const btnComprar = document.getElementById('comprar-agora');
            if (btnComprar) {
                btnComprar.addEventListener('click', () => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const id = urlParams.get('id') || 'fone-01';
                    const produto = PRODUTOS_BD[id];

                    if (produto) {
                        const qtd = parseInt(inputQtd.value);
                        for (let i = 0; i < qtd; i++) {
                            CarrinhoCheckoutModule.adicionarProduto({
                                id: produto.id,
                                nome: produto.nome,
                                preco: parseFloat(produto.preco)
                            });
                        }
                        window.location.href = 'carrinho.html';
                    }
                });
            }
        });
    </script>
</body>
</html>
