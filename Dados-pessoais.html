<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dados Pessoais e Senha - E-commerce</title>
  <link rel="stylesheet" href="Folha-estilos/Dados-pessoais.css">
</head>
<body>

  <header class="header">
    <button type="button" onclick="history.back()" class="btn-voltar" title="Voltar">&#8592;</button>
    <h1 class="header-titulo">Meus Dados e Senha</h1>
    <div class="header-espaco"></div>
  </header>

  <main class="container">

    <section class="card-secao">
      <h2 class="secao-titulo">📍 Dados Pessoais</h2>
      
      <form class="form-dados" action="perfil.html" method="GET">
        
        <div class="campo">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" value="João O. Silva" required>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" value="joao.silva@email.com" required>
        </div>

        <div class="campo">
          <label for="telefone">Telefone / WhatsApp</label>
          <input type="tel" id="telefone" value="(62) 99999-8888" required>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" value="123.456.789-00" disabled class="input-disabled">
          </div>
          <div class="campo">
            <label for="nascimento">Data de Nasc.</label>
            <input type="date" id="nascimento" value="1992-05-15">
          </div>
        </div>

        <button type="submit" class="btn-salvar">Salvar Alterações</button>
      </form>
    </section>

    <section class="card-secao">
      <h2 class="secao-titulo">🔒 Alterar Senha</h2>

      <form class="form-dados" action="perfil.html" method="GET">
        
        <div class="campo">
          <label for="senha-atual">Senha Atual</label>
          <input type="password" id="senha-atual" name="senha-atual" placeholder="Digite sua senha atual" autocomplete="current-password" required>
        </div>

        <div class="campo">
          <label for="nova-senha">Nova Senha</label>
          <input type="password" id="nova-senha" name="nova-senha" placeholder="No mínimo 8 caracteres" autocomplete="new-password" required>
        </div>

        <div class="campo">
          <label for="confirmar-senha">Confirmar Nova Senha</label>
          <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a nova senha" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn-salvar btn-seguranca">Atualizar Senha</button>
      </form>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="notificacoes.html" class="nav-item">
      <span class="nav-icon">🔔</span>
      <span>Avisos</span>
    </a>
    <a href="carrinho.html" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span class="carrinho-count">2</span>
      <span>Carrinho</span>
    </a>
    <a href="perfil.html" class="nav-item active">
      <span class="nav-icon">👤</span>
      <span>Perfil</span>
    </a>
  </nav>

</body>
</html>
