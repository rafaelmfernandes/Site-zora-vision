<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- ========================================== -->
  <!-- PROTEÇÃO DE ACESSO: só o e-mail do admin passa daqui.  -->
  <!-- Roda antes do resto da página, pra ninguém ver conteúdo -->
  <!-- administrativo mesmo por uma fração de segundo.        -->
  <!-- ========================================== -->
  <script>
    (function verificarAcessoAdmin() {
      var EMAIL_ADMIN = 'rafaelmelo116@gmail.com';
      var usuarioLogado = JSON.parse(localStorage.getItem('usuario_logado'));

      if (!usuarioLogado || !usuarioLogado.email || usuarioLogado.email.toLowerCase() !== EMAIL_ADMIN.toLowerCase()) {
        window.location.href = '02-Login.html';
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Produto - Painel Admin</title>
  <link rel="stylesheet" href="Folha-estilos/Cadastro-produto.css">
</head>
<body>

  <header class="admin-header">
    <div class="header-conteudo">
      <button type="button" onclick="history.back()" class="btn-voltar" title="Voltar ao Painel">&#8592; Voltar</button>
      <h1 class="admin-titulo">Cadastrar Novo Produto</h1>
      <div class="header-espaco"></div>
    </div>
  </header>

  <main class="container">

    <form class="form-produto" id="form-cadastrar-produto">

      <section class="card-secao">
        <h2 class="secao-titulo">📸 Imagens do Produto</h2>
        <div class="upload-box" onclick="document.getElementById('input-foto').click()" style="cursor: pointer; text-align: center;">
          <span class="upload-icone" id="preview-icone" style="font-size: 2.5rem;">🖼️</span>
          <p class="upload-texto" id="preview-texto"><strong>Clique aqui</strong> ou arraste as fotos do produto</p>
          <span class="upload-subtexto">PNG, JPG ou WEBP (Recomendado: 800x800px)</span>
          <input type="file" id="input-foto" accept="image/*" style="display: none;">
        </div>
      </section>

      <section class="card-secao">
        <h2 class="secao-titulo">📝 Informações Básicas</h2>
        
        <div class="campo">
          <label for="nome-produto">Nome do Produto *</label>
          <input type="text" id="nome-produto" placeholder="Ex.: Fone Bluetooth Sem Fio Premium" required>
        </div>

        <div class="campo">
          <label for="categoria">Categoria *</label>
          <select id="categoria" required>
            <option value="" disabled selected>
              Carregando categorias...
            </option>
          </select>
        </div>

        <div class="campo">
          <label for="descricao">Descrição Detalhada</label>
          <textarea id="descricao" rows="4" placeholder="Descreva os detalhes, especificações e benefícios do produto..."></textarea>
        </div>
      </section>

      <section class="card-secao">
        <h2 class="secao-titulo">💰 Preço e Estoque</h2>

        <div class="linha-dupla">
          <div class="campo">
            <label for="preco-venda">Preço de Venda (R$) *</label>
            <input type="number" id="preco-venda" step="0.01" placeholder="129.90" required>
          </div>
          <div class="campo">
            <label for="preco-original">Preço Antigo (R$)</label>
            <input type="number" id="preco-original" step="0.01" placeholder="159.90" title="Para mostrar desconto 'De R$ X por R$ Y'">
          </div>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="estoque">Estoque Inicial *</label>
            <input type="number" id="estoque" placeholder="10" min="0" required>
          </div>
          <div class="campo">
            <label for="sku">Código SKU / Referência</label>
            <input type="text" id="sku" placeholder="EX-1020">
          </div>
        </div>
      </section>

      <section class="card-secao">
        <h2 class="secao-titulo">⚙️ Opções de Exibição</h2>

        <label class="checkbox-opcao" style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer;">
          <input type="checkbox" id="produto-ativo" checked>
          <span><strong>Ativar Produto:</strong> Visível imediatamente na loja pública.</span>
        </label>

        <label class="checkbox-opcao" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="produto-destaque">
          <span><strong>Produto em Destaque:</strong> Exibir na seção de destaque da Home.</span>
        </label>
      </section>

      <div class="botoes-container" style="display: flex; gap: 1rem; margin-top: 2rem;">
        <button type="button" onclick="history.back()" class="btn-cancelar" style="flex: 1; padding: 12px; cursor: pointer;">Cancelar</button>
        <button type="submit" class="btn-salvar-produto" style="flex: 2; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Salvar e Publicar Produto</button>
      </div>

    </form>

  </main>

  <!-- Script separado colocado antes do fechamento do body -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="Supabase/supabase.js"></script>

  <script src="Scripts/cadastro-produto.js"></script>
</body>
</html>
