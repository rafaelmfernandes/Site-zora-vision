<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos Favoritos</title>
  <link rel="stylesheet" href="Folha-estilos/Produtos-favoritos.css">
</head>
<body>

  <!-- TOPO / HEADER -->
  <header class="admin-header">
    <div class="header-conteudo">
      <a href="javascript:history.back()" class="btn-voltar" title="Voltar">&#8592; Início</a>
      <h1 class="admin-titulo">Produtos Favoritos</h1>
      <span class="badge-contador" id="favoritos-contador">0 Itens</span>
    </div>
  </header>

  <main class="container">

    <!-- BARRA DE AÇÕES E FILTRO -->
    <section class="barra-acoes">
      <div class="busca-box">
        <input type="text" id="busca-favoritos" placeholder="Buscar nos favoritos...">
      </div>
      <button class="btn-limpar" id="btn-limpar-favoritos">Limpar Favoritos</button>
    </section>

    <!-- MENSAGEM EXIBIDA QUANDO NÃO HÁ FAVORITOS -->
    <div id="favoritos-vazio" style="display: none; text-align: center; padding: 3rem 1rem; color: #64748b;">
      <p style="font-size: 1.05rem; margin-bottom: 0.5rem;">Você ainda não tem favoritos 💔</p>
      <p style="font-size: 0.85rem;">Toque no coração de um produto para adicioná-lo aqui.</p>
    </div>

    <!-- GRID DE PRODUTOS FAVORITOS (PREENCHIDO DINAMICAMENTE VIA JS) -->
    <section class="grid-favoritos" id="grid-favoritos">
      <!-- Os cards de produtos favoritados são injetados aqui pelo Favoritos.js -->
    </section>

  </main>

  <!-- SCRIPTS DA APLICAÇÃO -->
  <script src="Scripts/Favoritos.js"></script>
</body>
</html>
