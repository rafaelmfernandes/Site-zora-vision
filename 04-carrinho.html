<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Carrinho - ZoraVision</title>


    <!-- ========================================================= -->
    <!-- CSS -->
    <!-- ========================================================= -->

    <link
        rel="stylesheet"
        href="Folha-estilos/Carrinho.css"
    >

</head>


<body>


    <!-- ========================================================= -->
    <!-- CABEÇALHO -->
    <!-- ========================================================= -->

    <header class="header">

        <button
            type="button"
            onclick="voltarPaginaAnterior()"
            class="btn-voltar"
            title="Voltar"
        >
            ←
        </button>


        <h1 class="header-titulo">
            Meu Carrinho
        </h1>


        <span
            class="badge-carrinho header-espaco"
        >
            0
        </span>

    </header>


    <!-- ========================================================= -->
    <!-- LISTA DE PRODUTOS -->
    <!-- ========================================================= -->

    <div
        class="carrinho-lista"
        id="lista-carrinho"
    >
        <!-- Produtos carregados pelo 04-carrinho.js -->
    </div>


    <!-- ========================================================= -->
    <!-- CUPOM -->
    <!-- ========================================================= -->

    <div class="cupom-container">

        <div class="cupom-box">

            <input
                type="text"
                class="cupom-input"
                id="input-cupom"
                placeholder="Código do cupom"
            >

            <button
                type="button"
                class="btn-cupom"
                onclick="aplicarCupomCarrinho()"
            >
                Aplicar
            </button>

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- RESUMO -->
    <!-- ========================================================= -->

    <div class="resumo-fixo">

        <div class="resumo-linha">

            <span>
                Subtotal
            </span>

            <span id="resumo-subtotal">
                R$ 0,00
            </span>

        </div>


        <div class="resumo-linha">

            <span>
                Frete
            </span>

            <span class="frete-gratis">
                Grátis
            </span>

        </div>


        <div class="resumo-linha total">

            <span>
                Total
            </span>

            <span
                class="total-valor"
                id="valor-total"
            >
                R$ 0,00
            </span>

        </div>


        <div
            class="resumo-botoes"
            style="display:flex; gap:10px;"
        >

            <button
                type="button"
                onclick="voltarPaginaAnterior()"
                class="btn-continuar"
                style="
                    flex:1;
                    background-color:#f1f5f9;
                    color:#334155;
                    border:none;
                    padding:14px;
                    border-radius:8px;
                    font-size:0.9rem;
                    font-weight:700;
                    cursor:pointer;
                "
            >
                Continuar Comprando
            </button>


            <button
                type="button"
                id="btn-finalizar"
                onclick="finalizarPedido()"
                class="btn-finalizar"
                style="
                    flex:1;
                    border:none;
                    cursor:pointer;
                "
            >
                Finalizar Pedido
            </button>

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================================= -->
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Conexão com Supabase -->
    <script src="Supabase/supabase.js"></script>

    <!-- JavaScript do Carrinho -->
    <script src="Scripts/05-carrinho.js"></script>
</body>

</html>
