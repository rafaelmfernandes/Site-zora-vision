<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Endereço - E-commerce</title>
  <link rel="stylesheet" href="Folha-estilos/Cadastrar-endereço.css">
</head>
<body>

  <header class="header">
    <button type="button" onclick="history.back()" class="btn-voltar" title="Voltar">&#8592;</button>
    <h1 class="header-titulo">Novo Endereço</h1>
    <div class="header-espaco"></div>
  </header>

  <main class="container">

    <form class="form-endereco" action="enderecos.html" method="GET">

      <div class="campo">
        <label>Tipo de Endereço</label>
        <div class="tipos-container">
          <label class="tipo-opcao">
            <input type="radio" name="tipo_endereco" value="casa" checked>
            <span class="tipo-btn">🏠 Casa</span>
          </label>
          <label class="tipo-opcao">
            <input type="radio" name="tipo_endereco" value="trabalho">
            <span class="tipo-btn">💼 Trabalho</span>
          </label>
          <label class="tipo-opcao">
            <input type="radio" name="tipo_endereco" value="outro">
            <span class="tipo-btn">📍 Outro</span>
          </label>
        </div>
      </div>

      <div class="campo">
        <label for="nome-destinatario">Nome de quem vai receber</label>
        <input type="text" id="nome-destinatario" placeholder="Ex.: João Silva" required>
      </div>

      <div class="campo">
        <label for="cep">CEP</label>
        <div class="input-cep-group">
          <input type="text" id="cep" placeholder="00000-000" maxlength="9" required>
          <button type="button" class="btn-buscar-cep">Buscar</button>
        </div>
      </div>

      <div class="campo">
        <label for="rua">Rua / Avenida / Alameda</label>
        <input type="text" id="rua" placeholder="Ex.: Rua T-63" required>
      </div>

      <div class="linha-dupla">
        <div class="campo">
          <label for="numero">Número</label>
          <input type="text" id="numero" placeholder="Ex.: 1020" required>
        </div>
        <div class="campo">
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" placeholder="Apt, Qd, Lt">
        </div>
      </div>

      <div class="campo">
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" placeholder="Ex.: Setor Bueno" required>
      </div>

      <div class="linha-cidade-uf">
        <div class="campo campo-cidade">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" placeholder="Ex.: Goiânia" required>
        </div>
        <div class="campo campo-uf">
          <label for="uf">UF</label>
          <input type="text" id="uf" placeholder="GO" maxlength="2" required>
        </div>
      </div>

      <div class="campo">
        <label for="referencia">Ponto de Referência (Opcional)</label>
        <input type="text" id="referencia" placeholder="Ex.: Próximo ao supermercado">
      </div>

      <label class="checkbox-opcao">
        <input type="checkbox" name="principal" checked>
        <span>Definir como meu endereço principal</span>
      </label>

      <button type="submit" class="btn-salvar">Salvar Endereço</button>

    </form>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="notificacoes.html" class="nav-item">
      <span class="nav-icon">🔔</span>
      <span>Avisos</span>
    </a>
    <a href="carrinho.html" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span class="carrinho-count">2</span>
      <span>Carrinho</span>
    </a>
    <a href="perfil.html" class="nav-item active">
      <span class="nav-icon">👤</span>
      <span>Perfil</span>
    </a>
  </nav>

</body>
</html>
