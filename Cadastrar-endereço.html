<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Endereço - E-commerce</title>
  <link rel="stylesheet" href="Folha-estilos/Cadastrar-endereço.css">
</head>
<body>

  <header class="header">
    <button type="button" onclick="history.back()" class="btn-voltar" title="Voltar">&#8592;</button>
    <h1 class="header-titulo">Novo Endereço</h1>
    <div class="header-espaco"></div>
  </header>

  <main class="container">

    <form class="form-endereco" id="form-cadastrar-endereco">

      <div class="campo">
        <label>Tipo de Endereço</label>
        <div class="tipos-container">
          <label class="tipo-opcao">
            <input type="radio" name="tipo_endereco" value="casa" checked>
            <span class="tipo-btn">🏠 Casa</span>
          </label>
          <label class="tipo-opcao">
            <input type="radio" name="tipo_endereco" value="trabalho">
            <span class="tipo-btn">💼 Trabalho</span>
          </label>
          <label class="tipo-opcao">
            <input type="radio" name="tipo_endereco" value="outro">
            <span class="tipo-btn">📍 Outro</span>
          </label>
        </div>
      </div>

      <div class="campo">
        <label for="nome-destinatario">Nome de quem vai receber</label>
        <input type="text" id="nome-destinatario" name="name" autocomplete="name" placeholder="Ex.: João Silva" required>
      </div>

      <div class="campo">
        <label for="cep">CEP</label>
        <div class="input-cep-group">
          <input type="text" id="cep" name="postal-code" autocomplete="postal-code" placeholder="00000-000" maxlength="9" required>
          <button type="button" class="btn-buscar-cep" onclick="buscarCepCadastro()">Buscar</button>
        </div>
        <small id="cep-status" style="font-size: 12px; margin-top: 4px; display: block;"></small>
      </div>

      <div class="campo">
        <label for="rua">Rua / Avenida / Alameda</label>
        <input type="text" id="rua" name="address-line1" autocomplete="address-line1" placeholder="Ex.: Rua T-63" required>
      </div>

      <div class="linha-dupla">
        <div class="campo">
          <label for="numero">Número</label>
          <input type="text" id="numero" name="address-line2" autocomplete="address-line2" placeholder="Ex.: 1020" required>
        </div>
        <div class="campo">
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" name="address-line3" autocomplete="address-line3" placeholder="Apt, Qd, Lt">
        </div>
      </div>

      <div class="campo">
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" name="address-level3" autocomplete="address-level3" placeholder="Ex.: Setor Bueno" required>
      </div>

      <div class="linha-cidade-uf">
        <div class="campo campo-cidade">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="address-level2" autocomplete="address-level2" placeholder="Ex.: Goiânia" required>
        </div>
        <div class="campo campo-uf">
          <label for="uf">UF</label>
          <input type="text" id="uf" name="address-level1" autocomplete="address-level1" placeholder="GO" maxlength="2" required>
        </div>
      </div>

      <div class="campo">
        <label for="referencia">Ponto de Referência (Opcional)</label>
        <input type="text" id="referencia" placeholder="Ex.: Próximo ao supermercado">
      </div>

      <label class="checkbox-opcao">
        <input type="checkbox" name="principal" id="chk-principal" checked>
        <span>Definir como meu endereço principal</span>
      </label>

      <button type="submit" class="btn-salvar">Salvar Endereço</button>

    </form>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px; height:18px; vertical-align:middle;"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg></span>
      <span>Home</span>
    </a>
    <a href="Categorias.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px; height:18px; vertical-align:middle;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></span>
      <span>Categorias</span>
    </a>
    <a href="carrinho.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px; height:18px; vertical-align:middle;"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 7H6"></path></svg></span>
      <span class="carrinho-count">0</span>
      <span>Carrinho</span>
    </a>
    <a href="Meu-perfil.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px; height:18px; vertical-align:middle;"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg></span>
      <span>Perfil</span>
    </a>
  </nav>

  <!-- IMPORTA O CLIENTE DO SUPABASE (CDN e inicialização) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="Supabase/supabase.js"></script>
   <!-- Ou o nome do arquivo onde você instancia o createClient -->

  <!-- IMPORTA O SCRIPT DE CADASTRO DE ENDEREÇOS -->
  <script src="Scripts/Cadastrar-endereco.js"></script>

</body>
</html>
