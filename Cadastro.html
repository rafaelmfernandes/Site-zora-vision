<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - E-commerce</title>
  <link rel="stylesheet" href="Folha-estilos/Cadastro.css">
</head>
<body>

  <header class="header">
    <a href="Login.html" class="btn-voltar" title="Voltar">&#8592;</a>
    <h1 class="header-titulo">Criar Conta</h1>
    <div class="header-espaco"></div>
  </header>

  <main class="cadastro-container">

    <div class="boas-vindas">
      <h2>Crie sua conta 👋</h2>
      <p>Cadastre-se para acompanhar seus pedidos e receber ofertas exclusivas.</p>
    </div>

    <div class="social-box">
      <a href="#" class="btn-social google">
        <span class="social-icon">🌐</span>
        <span>Continuar com o Google</span>
      </a>

      <a href="#" class="btn-social apple">
        <span class="social-icon">🍎</span>
        <span>Continuar com a Apple</span>
      </a>
    </div>

    <div class="divisor">
      <span class="linha"></span>
      <span class="divisor-texto">OU</span>
      <span class="linha"></span>
    </div>

    <form id="form-cadastro">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo" required>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email-cadastro" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha-cadastro" placeholder="Crie uma senha segura" required>
      </div>

      <div class="campo">
        <label for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="confirmar-senha" placeholder="Digite a senha novamente" required>
      </div>

      <button type="submit" class="btn-cadastrar">Criar minha conta</button>
    </form>

    <div class="link-login-box">
      Já tem uma conta? <a href="Login.html">Fazer login</a>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px; vertical-align:middle;"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg></span>
      <span>Home</span>
    </a>
    <a href="Categorias.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px; vertical-align:middle;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></span>
      <span>Categorias</span>
    </a>
    <a href="carrinho.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px; vertical-align:middle;"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 7H6"></path></svg></span>
      <span class="carrinho-count">2</span>
      <span>Carrinho</span>
    </a>
    <a href="Login.html" class="nav-item active">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px; vertical-align:middle;"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg></span>
      <span>Entrar</span>
    </a>
  </nav>

  
  <!-- 3. Lógica específica desta tela -->
  <script src="Scripts/Cadastro.js"></script>
</body>
</html>
