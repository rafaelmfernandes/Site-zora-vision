<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja - E-commerce</title>
  <link rel="stylesheet" href="Folha-estilos/index2.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="header-logo">SuaLoja<span>.com</span></a>
    
    <a href="notificacoes.html" class="notificacao-btn" title="Notificações">
      🔔<span class="notificacao-badge"></span>
    </a>
  </header>

  <div class="search-container">
    <input type="text" class="search-input" placeholder="🔍 Buscar produtos, marcas..." />
  </div>

  <section class="banner">
    <span class="banner-badge">Ofertas da Semana</span>
    <h2 class="banner-titulo">Até 40% OFF + Frete Grátis</h2>
    <p class="banner-subtitulo">Aproveite as melhores novidades com entrega rápida.</p>
  </section>

  <main class="secao-container">
    <div class="secao-header">
      <h3 class="secao-titulo">Produtos em Destaque</h3>
      <a href="#" class="secao-link">Ver todos</a>
    </div>

    <div class="produtos-grid">
      <a href="Produtos.html" class="card-link">
        <div class="card">
          <div class="card-img-box">🎧</div>
          <div class="card-body">
            <span class="card-tag">Frete Grátis</span>
            <h4 class="card-titulo">Fone Bluetooth Premium</h4>
            <div class="card-preco">R$ 129,90</div>
          </div>
        </div>
      </a>

      <a href="produto.html" class="card-link">
        <div class="card">
          <div class="card-img-box">⌚</div>
          <div class="card-body">
            <span class="card-tag">Mais Vendido</span>
            <h4 class="card-titulo">Smartwatch Fit Pro</h4>
            <div class="card-preco">R$ 199,90</div>
          </div>
        </div>
      </a>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" onclick="location.reload();" class="nav-item active" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="Notificaçoes.html" class="nav-item">
      <span class="nav-icon">🔔</span>
      <span>Avisos</span>
    </a>
    <a href="carrinho.html" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span class="carrinho-count">2</span>
      <span>Carrinho</span>
    </a>
    <a href="Meu-perfil.html" class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Entrar</span>
    </a>
  </nav>

</body>
</html>
