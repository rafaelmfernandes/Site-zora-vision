<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuaLoja.com - E-commerce</title>
    <link rel="stylesheet" href="Folha-estilos/index2.css">
</head>
<body>

    <!-- Header do Site -->
    <header class="header">
        <a href="index.html" class="header-logo">SuaLoja<span>.com</span></a>
        <a href="#" class="notificacao-btn" aria-label="Notificações">
            🔔
            <span class="notificacao-badge"></span>
        </a>
    </header>

    <!-- Barra de Pesquisa -->
    <section class="search-container">
        <input type="text" class="search-input" placeholder="Buscar produtos, marcas...">
    </section>

    <!-- Banner Promocional -->
    <section class="banner">
        <span class="banner-badge">PROMOÇÃO</span>
        <h2 class="banner-titulo">Até 40% OFF + Frete Grátis</h2>
        <p class="banner-subtitulo">Aproveite as melhores novidades com entrega rápida.</p>
    </section>

    <!-- Catálogo de Produtos em Destaque -->
    <main class="secao-container">
        <div class="secao-header">
            <h2 class="secao-titulo">Produtos em Destaque</h2>
            <a href="#" class="secao-link">Ver todos</a>
        </div>

        <!-- Grid dinâmico onde os produtos cadastrados no painel serão injetados -->
        <div class="produtos-grid" id="grid-produtos-home">
            
            <!-- Produtos padrão (caso o localStorage esteja vazio) -->
            <div class="card-produto">
                <div class="card-img-box">🎧</div>
                <h3>Fone de Ouvido Bluetooth Premium</h3>
                <span class="preco">R$ 189,90</span>
                <button class="btn-adicionar" 
                        data-id="fone-01" 
                        data-nome="Fone de Ouvido Bluetooth Premium" 
                        data-preco="189.90">
                    Adicionar ao Carrinho
                </button>
            </div>

            <div class="card-produto">
                <div class="card-img-box">💡</div>
                <h3>Luminária de Mesa Minimalista</h3>
                <span class="preco">R$ 120,00</span>
                <button class="btn-adicionar" 
                        data-id="deco-02" 
                        data-nome="Luminária de Mesa Minimalista" 
                        data-preco="120.00">
                    Adicionar ao Carrinho
                </button>
            </div>

        </div>
    </main>

    <!-- Menu Inferior de Navegação -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">🔔</span>
            <span>Avisos</span>
        </a>
        <a href="carrinho.html" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span class="carrinho-badge">0</span>
            <span>Carrinho</span>
        </a>
        <a href="Meu-perfil.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Entrar</span>
        </a>
    </nav>

    <!-- Script de Carregamento Dinâmico dos Produtos Cadastrados -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const gridProdutos = document.getElementById('grid-produtos-home');
        if (!gridProdutos) return;

        // Recupera os produtos salvos no painel admin[cite: 8]
        const produtosSalvos = JSON.parse(localStorage.getItem('produtos_loja')) || [];
        const produtosAtivos = produtosSalvos.filter(p => p.ativo !== false);

        // Se houver produtos cadastrados, substitui o conteúdo padrão pela vitrine dinâmica[cite: 8]
        if (produtosAtivos.length > 0) {
          gridProdutos.innerHTML = '';

          produtosAtivos.forEach(produto => {
            const precoFormatado = parseFloat(produto.preco || 0).toFixed(2).replace('.', ',');
            const imagemSrc = produto.imagem;
            const ehImagemUrl = typeof imagemSrc === 'string' && (imagemSrc.startsWith('data:image') || imagemSrc.startsWith('http'));

            const card = document.createElement('div');
            card.className = 'card-produto';
            card.innerHTML = `
              <a href="Produtos.html?id=${produto.id}" style="text-decoration: none; color: inherit; display: block;">
                <div class="card-img-box" style="${ehImagemUrl ? 'padding: 0; overflow: hidden;' : ''}">
                  ${ehImagemUrl ? `<img src="${imagemSrc}" alt="${produto.nome}" style="width: 100%; height: 100%; object-fit: cover;">` : (imagemSrc || '📦')}
                </div>
                <h3>${produto.nome}</h3>
                <span class="preco">R$ ${precoFormatado}</span>
              </a>
              <button class="btn-adicionar" 
                      data-id="${produto.id}" 
                      data-nome="${produto.nome}" 
                      data-preco="${produto.preco}"
                      data-imagem="${ehImagemUrl ? imagemSrc : ''}">
                  Adicionar ao Carrinho
              </button>
            `;
            gridProdutos.appendChild(card);
          });
        }
      });
    </script>

    <!-- Importação do JavaScript do Carrinho -->
    <script src="Scripts/Carrinho-checkout.js"></script>

</body>
</html>
