<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuaLoja.com - E-commerce</title>
    <link rel="stylesheet" href="Folha-estilos/index2.css">
</head>
<body>

    <!-- Header do Site -->
    <header class="header">
        <a href="index.html" class="header-logo">SuaLoja<span>.com</span></a>
        <a href="#" class="notificacao-btn" aria-label="Notificações">
            🔔
            <span class="notificacao-badge"></span>
        </a>
    </header>

    <!-- Barra de Pesquisa -->
    <section class="search-container">
        <input type="text" class="search-input" placeholder="Buscar produtos, marcas...">
    </section>

    <!-- Banner Promocional -->
    <section class="banner">
        <span class="banner-badge">PROMOÇÃO</span>
        <h2 class="banner-titulo">Até 40% OFF + Frete Grátis</h2>
        <p class="banner-subtitulo">Aproveite as melhores novidades com entrega rápida.</p>
    </section>

    <!-- Catálogo de Produtos em Destaque -->
    <main class="secao-container">
        <div class="secao-header">
            <h2 class="secao-titulo">Produtos em Destaque</h2>
            <a href="#" class="secao-link">Ver todos</a>
        </div>

        <div class="produtos-grid">
            
            <!-- Produto 1: Eletrônico -->
            <div class="card-produto">
                <div class="card-img-box">🎧</div>
                <h3>Fone de Ouvido Bluetooth Premium</h3>
                <span class="preco">R$ 189,90</span>
                <button class="btn-adicionar" 
                        data-id="fone-01" 
                        data-nome="Fone de Ouvido Bluetooth Premium" 
                        data-preco="189.90">
                    Adicionar ao Carrinho
                </button>
            </div>

            <!-- Produto 2: Decoração -->
            <div class="card-produto">
                <div class="card-img-box">💡</div>
                <h3>Luminária de Mesa Minimalista</h3>
                <span class="preco">R$ 120,00</span>
                <button class="btn-adicionar" 
                        data-id="deco-02" 
                        data-nome="Luminária de Mesa Minimalista" 
                        data-preco="120.00">
                    Adicionar ao Carrinho
                </button>
            </div>

        </div>
    </main>

    <!-- Menu Inferior de Navegação -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">🔔</span>
            <span>Avisos</span>
        </a>
        <a href="carrinho.html" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span class="carrinho-badge">0</span>
            <span>Carrinho</span>
        </a>
        <a href="Meu-perfil.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Entrar</span>
        </a>
    </nav>

    <!-- Importação do JavaScript do Carrinho -->
    <script src="Scripts/Carrinho-checkout.js"></script>

</body>
</html>
