<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- ========================================== -->
  <!-- PROTEÇÃO DE ACESSO: só o e-mail do admin passa daqui.  -->
  <!-- Roda antes do resto da página, pra ninguém ver conteúdo -->
  <!-- administrativo mesmo por uma fração de segundo.        -->
  <!-- ========================================== -->
  <script>
    (function verificarAcessoAdmin() {
      var EMAIL_ADMIN = 'rafaelmelo116@gmail.com';
      var usuarioLogado = JSON.parse(localStorage.getItem('usuario_logado'));

      if (!usuarioLogado || !usuarioLogado.email || usuarioLogado.email.toLowerCase() !== EMAIL_ADMIN.toLowerCase()) {
        window.location.href = '02-Login.html';
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos Pendentes para Separação - Admin</title>
  <link rel="stylesheet" href="Folha-estilos/pedidos-pendentes.css">
</head>
<body>

<header class="pp-header">
  <div class="pp-header-inner">

    <!-- Lado Esquerdo: Botão Voltar + Título e Subtítulo -->
    <div class="pp-header-esquerda">
      <a href="javascript:history.back()" title="Voltar" class="pp-btn-voltar">&#8592;</a>

      <div>
        <h1 class="pp-titulo">
          <span>📋</span> Pedidos Pendentes para Separação
        </h1>
        <p class="pp-subtitulo">Gerencie os pedidos que aguardam separação e despacho</p>
      </div>
    </div>

    <!-- Lado Direito: Badge de Contador -->
    <div class="pp-badge-topo">
      <span>📦</span> <span id="contador-topo-pendentes">0</span> Pendentes
    </div>

  </div>
</header>

  <main class="pp-container" id="container-pedidos-pendentes">
    <!-- Preenchido via JS -->
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      carregarPendentes();
    });

    function carregarPendentes() {
      const container = document.getElementById('container-pedidos-pendentes');
      const badgeTopo = document.getElementById('contador-topo-pendentes');

      let pedidosLoja = JSON.parse(localStorage.getItem('pedidos_loja')) || [];
      let historicoCliente = JSON.parse(localStorage.getItem('historico_pedidos_cliente')) || [];

      // Filtra estritamente apenas os pendentes / em separação que não foram cancelados
      const todosMap = new Map();
      [...pedidosLoja, ...historicoCliente].forEach(p => {
        const id = p.id || p.numero;
        if (id) todosMap.set(String(id), p);
      });

      // Mostra qualquer pedido que ainda não chegou num status final
      // (continua aparecendo em "Em Separação" e "Em Transporte", some só quando Entregue ou Cancelado)
      const pedidosPendentes = Array.from(todosMap.values()).filter(p => {
        const st = (p.status || 'Em Separação').toLowerCase();
        const eEntregue = st.includes('entregue') || st.includes('concluido') || st.includes('concluído');
        const eCancelado = st.includes('cancelado');
        return !eEntregue && !eCancelado;
      });

      if (badgeTopo) {
        badgeTopo.textContent = pedidosPendentes.length;
      }

      if (pedidosPendentes.length === 0) {
        container.innerHTML = `
          <div class="pp-vazio">
            <p>Nenhum pedido aguardando separação! 🎉</p>
            <p>Todos os pedidos foram despachados ou concluídos.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      pedidosPendentes.forEach((pedido, index) => {
        const idPedido = pedido.id || pedido.numero || `849${index}`;
        const nomeCliente = pedido.cliente?.nome || pedido.endereco?.nome || 'Cliente';
        const total = parseFloat(pedido.total || 0).toFixed(2).replace('.', ',');
        const statusAtual = pedido.status || 'Em Separação';
        const jaEmTransporte = statusAtual.toLowerCase().includes('transporte') || statusAtual.toLowerCase().includes('trânsito');

        let itensHtml = '';
        (pedido.itens || []).forEach(item => {
          itensHtml += `<li>${item.quantidade || 1}x ${item.nome || 'Produto'}</li>`;
        });

        const card = document.createElement('div');
        card.className = 'pp-card';
        card.innerHTML = `
          <div class="pp-card-topo">
            <strong class="pp-pedido-numero">Pedido #${String(idPedido).replace('#', '')}</strong>
            <span class="pp-status-badge${jaEmTransporte ? ' em-transporte' : ''}">${statusAtual}</span>
          </div>
          <div class="pp-cliente">
            👤 <strong>Cliente:</strong> ${nomeCliente}
          </div>
          <div class="pp-itens-box">
            <div class="pp-itens-titulo">Itens:</div>
            <ul class="pp-itens-lista">${itensHtml}</ul>
          </div>
          <div class="pp-card-rodape">
            <strong class="pp-total">R$ ${total}</strong>
            <div class="pp-acoes">
              ${!jaEmTransporte ? `<button onclick="mudarStatus('${idPedido}', 'Em Transporte')" class="pp-btn-acao pp-btn-enviar">🚚 Enviar (Em Trânsito)</button>` : ''}
              <button onclick="mudarStatus('${idPedido}', 'Entregue')" class="pp-btn-acao pp-btn-concluir">✅ Concluir (Entregue)</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function mudarStatus(idPedido, novoStatus) {
      let historico = JSON.parse(localStorage.getItem('historico_pedidos_cliente')) || [];
      let pedidosLoja = JSON.parse(localStorage.getItem('pedidos_loja')) || [];
      const idLimpo = String(idPedido).replace('#', '');

      historico = historico.map(p => {
        if (String(p.id || p.numero || '').replace('#', '') === idLimpo) p.status = novoStatus;
        return p;
      });

      pedidosLoja = pedidosLoja.map(p => {
        if (String(p.id || p.numero || '').replace('#', '') === idLimpo) p.status = novoStatus;
        return p;
      });

      localStorage.setItem('historico_pedidos_cliente', JSON.stringify(historico));
      localStorage.setItem('pedidos_loja', JSON.stringify(pedidosLoja));

      // Atualiza a tela imediatamente tirando o pedido da lista de pendentes
      carregarPendentes();
    }
  </script>
</body>
</html>
