<!DOCTYPE html>

<html lang="pt-BR">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Pedidos - ZoraVision</title>

<link
    rel="stylesheet"
    href="../Folha-estilos/admin-pedidos.css"
>


</head>

<body>

<header class="admin-header">


<div class="admin-header-top">

    <a
        href="05-admin.html"
        class="btn-voltar"
        aria-label="Voltar"
    >
        ‹
    </a>

    <div class="admin-logo">
        ZoraVision
    </div>

    <button
        type="button"
        class="btn-sair"
        id="btn-sair-admin"
    >
        Sair
    </button>

</div>

<div class="admin-header-info">

    <span class="admin-status"></span>

    <span>
        Gerenciamento de pedidos
    </span>

</div>


</header>

<main class="pedidos-container">


<!-- =====================================================
     TOPO
====================================================== -->

<section class="pedidos-topo">

    <span class="section-label">
        PEDIDOS
    </span>

    <h1>
        Gerenciar pedidos
    </h1>

    <p>
        Visualize os pedidos realizados e altere o status
        de cada pedido.
    </p>

</section>


<!-- =====================================================
     RESUMO
====================================================== -->

<section class="pedidos-resumo">


    <div class="resumo-pedido-card">

        <span>
            Total
        </span>

        <strong id="total-pedidos">
            0
        </strong>

    </div>


    <div class="resumo-pedido-card">

        <span>
            Pendentes
        </span>

        <strong id="pedidos-pendentes">
            0
        </strong>

    </div>


    <div class="resumo-pedido-card">

        <span>
            A caminho
        </span>

        <strong id="pedidos-caminho">
            0
        </strong>

    </div>


    <div class="resumo-pedido-card">

        <span>
            Entregues
        </span>

        <strong id="pedidos-entregues">
            0
        </strong>

    </div>


</section>


<!-- =====================================================
     FILTROS
====================================================== -->

<section class="pedidos-filtros">


    <div class="filtro-grupo">

        <label for="filtro-status">
            Status
        </label>

        <select id="filtro-status">

            <option value="todos">
                Todos
            </option>

            <option value="pendente">
                Pendente
            </option>

            <option value="processando">
                Processando
            </option>

            <option value="enviado">
                Enviado
            </option>

            <option value="a_caminho">
                A caminho
            </option>

            <option value="entregue">
                Entregue
            </option>

            <option value="cancelado">
                Cancelado
            </option>

        </select>

    </div>


    <div class="filtro-grupo pesquisa-grupo">

        <label for="campo-pesquisa">
            Pesquisar
        </label>

        <input
            type="search"
            id="campo-pesquisa"
            placeholder="Número do pedido ou cliente"
            autocomplete="off"
        >

    </div>


    <button
        type="button"
        id="btn-atualizar-pedidos"
        class="btn-atualizar"
    >
        Atualizar
    </button>


</section>


<!-- =====================================================
     MENSAGEM
====================================================== -->

<div
    id="mensagem-pedidos"
    class="mensagem-pedidos"
    style="display:none;"
></div>


<!-- =====================================================
     LISTA
====================================================== -->

<section
    id="lista-pedidos"
    class="lista-pedidos"
>

    <div class="pedidos-vazio">

        <div class="pedidos-vazio-icone">
            ⏳
        </div>

        <h2>
            Carregando pedidos
        </h2>

        <p>
            Consultando pedidos...
        </p>

    </div>

</section>


</main>

<footer class="admin-footer">


<strong>
    ZoraVision
</strong>

<span>
    Gerenciamento de pedidos
</span>


</footer>

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
    src="../Supabase/supabase.js"
></script>

<script
    src="Painel-admin.js"
></script>

<script
    src="admin-pedidos.js"
></script>

</body>

</html>
