<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Cartão - E-commerce</title>
  <link rel="stylesheet" href="Folha-estilos/Cadastro-pagamento.css">
</head>
<body>

  <header class="header">
    <a href="javascript:history.back()" class="btn-voltar" title="Voltar">&#8592;</a>
    <h1 class="header-titulo">Adicionar Cartão</h1>
    <div class="header-espaco"></div>
  </header>

  <main class="container">

    <div class="cartao-preview">
      <div class="cartao-topo">
        <span class="chip">📟</span>
        <span class="bandeira" id="preview-bandeira">💳</span>
      </div>
      <div class="cartao-numero" id="preview-numero">•••• •••• •••• ••••</div>
      <div class="cartao-rodape">
        <div class="cartao-titular">
          <span class="label">NOME DO TITULAR</span>
          <span class="val" id="preview-titular">NOME COMO NO CARTÃO</span>
        </div>
        <div class="cartao-validade">
          <span class="label">VALIDADE</span>
          <span class="val" id="preview-validade">MM/AA</span>
        </div>
      </div>
    </div>

    <form class="form-pagamento">

      <div class="campo">
        <label for="numero-cartao">Número do cartão</label>
        <input type="text" id="numero-cartao" placeholder="0000 0000 0000 0000" maxlength="19" required>
      </div>

      <div class="campo">
        <label for="nome-titular">Nome impresso no cartão</label>
        <input type="text" id="nome-titular" placeholder="Ex.: JOAO O SILVA" required>
      </div>

      <div class="linha-dupla">
        <div class="campo">
          <label for="validade">Validade</label>
          <input type="text" id="validade" placeholder="MM/AA" maxlength="5" required>
        </div>
        <div class="campo">
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" placeholder="123" maxlength="4" required>
        </div>
      </div>

      <div class="campo">
        <label for="cpf-titular">CPF do titular</label>
        <input type="text" id="cpf-titular" placeholder="000.000.000-00" required>
      </div>

      <label class="checkbox-opcao">
        <input type="checkbox" name="preferencial" checked>
        <span>Salvar como forma de pagamento principal</span>
      </label>

      <button type="submit" class="btn-salvar">Salvar Cartão</button>

    </form>

  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px; vertical-align:middle;"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg></span>
      <span>Home</span>
    </a>
    <a href="Categorias.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px; vertical-align:middle;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg></span>
      <span>Categorias</span>
    </a>
    <a href="carrinho.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px; vertical-align:middle;"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 7H6"></path></svg></span>
      <span class="carrinho-count">2</span>
      <span>Carrinho</span>
    </a>
    <a href="Meu-perfil.html" class="nav-item">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px; vertical-align:middle;"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg></span>
      <span>Perfil</span>
    </a>
  </nav>
  <!-- IMPORTA O SCRIPT GLOBAL DO SISTEMA -->
  <script src="Scripts/Carrinho-checkout.js"></script>
  <script src="Scripts/Cadastro-pagamento.js"></script>

</body>
</html>
